name: Gerar diagramas TikZ

on:
  push:
    paths:
      - 'obsidian/**'
      - 'scripts/render_tikz.py'
      - '.github/workflows/render-tikz.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-tikz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Apenas atualiza automaticamente a branch padrão do repositório.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4
      - name: Instalar LaTeX e Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
      - name: Gerar Markdown e SVGs
        run: python3 scripts/render_tikz.py --jobs 2
      - name: Publicar alterações geradas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- controle-I/ controle-II/
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nos arquivos gerados.'
          else
            git commit -m 'docs: atualizar anotações e diagramas SVG'
            git push origin HEAD
          fi
